name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure private release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PASSWORD repository secrets first."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/receiptflow.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=receiptflow\nkeyPassword=%s\n' "$RUNNER_TEMP/receiptflow.jks" "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - run: flutter build apk --release
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          cp docs/ReceiptFlow_Report.pdf dist/ 2>/dev/null || true
          cd dist
          sha256sum app-release.apk > SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ReceiptFlow $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: receiptflow-release
          path: dist/
